# Spins up just Postgres for local development.
# Run Django itself with: python manage.py runserver
version: "3.9"
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: twin
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: twin
    ports:
      - "5432:5432"
    volumes:
      - twin_pgdata:/var/lib/postgresql/data
volumes:
  twin_pgdata:
