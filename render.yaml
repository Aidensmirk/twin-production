databases:
  - name: twin-db
    databaseName: twin
    user: twin
    plan: free

services:
  - type: static_site
    name: twin-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && python manage.py seed_questions && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "twin-api.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: twin-db
          property: connectionString
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: CORS_ALLOWED_ORIGINS
        value: "https://twin-web.onrender.com"

  - type: web
    name: twin-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://twin-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
